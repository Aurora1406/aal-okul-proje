<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ankara Anadolu Lisesi - Yönetici Paneli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; }
        .blob { position: fixed; filter: blur(90px); border-radius: 50%; opacity: 0.4; z-index: 0; }
        .blob-1 { width: 50vw; height: 50vw; background: #374151; top: -10%; left: -10%; }
        .blob-2 { width: 40vw; height: 40vw; background: #1f2937; bottom: -10%; right: -10%; }
    </style>
</head>
<body class="text-gray-200 min-h-screen flex items-center justify-center p-6 relative overflow-x-hidden">

    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <!-- GİRİŞ EKRANI (LOGIN) -->
    <div id="login-box" class="w-full max-w-md bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-2xl shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <i class="fa-solid fa-lock text-4xl text-white mb-3"></i>
            <h2 class="text-2xl font-bold uppercase tracking-wider text-white">Yönetici Girişi</h2>
            <p class="text-xs text-gray-400 mt-1">Ankara Anadolu Lisesi Bilgi Sistemi</p>
        </div>
        <form id="login-form" class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">Kullanıcı Adı</label>
                <input type="text" id="kullanici" required class="w-full px-4 py-3 border border-white/20 bg-transparent text-white focus:outline-none focus:border-white rounded-lg text-sm" placeholder="Kullanıcı adınızı girin">
            </div>
            <div>
                <label class="block text-xs font-bold text-gray-300 mb-2 uppercase tracking-wider">Şifre</label>
                <input type="password" id="sifre" required class="w-full px-4 py-3 border border-white/20 bg-transparent text-white focus:outline-none focus:border-white rounded-lg text-sm" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-white text-black py-3 font-bold uppercase tracking-widest hover:bg-gray-300 transition-colors rounded-lg text-xs">
                Sisteme Giriş Yap
            </button>
        </form>
    </div>

    <!-- PANEL EKRANI -->
    <div id="dashboard-box" class="w-full max-w-5xl bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-2xl shadow-2xl relative z-10 hidden">
        <div class="flex justify-between items-center mb-8 border-b border-white/10 pb-4">
            <div>
                <h2 class="text-2xl font-bold uppercase tracking-wider text-white">Yönetim Paneli</h2>
                <p class="text-xs text-gray-400 mt-1">Randevu taleplerini ve duyuruları tek ekrandan yönetin.</p>
            </div>
            <button onclick="cikisYap()" class="border border-white/30 text-white px-5 py-2 text-xs font-bold uppercase hover:bg-white hover:text-black transition-colors rounded-lg">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Çıkış Yap
            </button>
        </div>

        <!-- DUYURU EKLEME FORMU -->
        <div class="mb-12 bg-black/40 p-6 rounded-xl border border-white/10">
            <h3 class="text-lg font-bold text-white mb-4 uppercase tracking-wide">Yeni Duyuru Yayınla</h3>
            <form id="duyuru-form" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">Duyuru Başlığı</label>
                        <input type="text" id="d-baslik" required class="w-full px-4 py-2 border border-white/20 bg-transparent text-white rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">Tarih</label>
                        <input type="date" id="d-tarih" required class="w-full px-4 py-2 border border-white/20 bg-transparent text-white rounded-lg text-sm [color-scheme:dark]">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">İçerik / Açıklama</label>
                    <textarea id="d-icerik" required rows="3" class="w-full px-4 py-2 border border-white/20 bg-transparent text-white rounded-lg text-sm"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-300 mb-2 uppercase">Görsel Seç (İsteğe Bağlı)</label>
                    <input type="file" id="d-gorsel" accept="image/*" class="w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-white file:text-black hover:file:bg-gray-300 cursor-pointer">
                </div>
                <div class="flex justify-end">
                    <button type="submit" class="bg-white text-black px-8 py-2.5 font-bold uppercase tracking-widest hover:bg-gray-300 transition-colors rounded-lg text-xs">
                        Duyuruyu Yayınla
                    </button>
                </div>
            </form>
        </div>

        <!-- YAYINLANAN DUYURULAR TABLOSU (SİLME ÖZELLİKLİ) -->
        <div class="mb-12">
            <h3 class="text-lg font-bold text-white mb-4 uppercase tracking-wide">Yayınlanan Duyurular (Silme İşlemi)</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-gray-300 border-collapse">
                    <thead class="text-xs text-white uppercase bg-black/50 border-b border-white/10">
                        <tr>
                            <th class="px-4 py-3">ID</th>
                            <th class="px-4 py-3">Başlık</th>
                            <th class="px-4 py-3">Tarih</th>
                            <th class="px-4 py-3 text-right">İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="admin-duyuru-tablo">
                        <!-- Dinamik doldurulacak -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- RANDEVU LİSTESİ TABLOSU -->
        <h3 class="text-lg font-bold text-white mb-4 uppercase tracking-wide">Gelen Randevu Talepleri</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-gray-300 border-collapse">
                <thead class="text-xs text-white uppercase bg-black/50 border-b border-white/10">
                    <tr>
                        <th class="px-4 py-3">ID</th>
                        <th class="px-4 py-3">Ad Soyad</th>
                        <th class="px-4 py-3">Tarih</th>
                        <th class="px-4 py-3">Konu</th>
                        <th class="px-4 py-3">Kayıt Zamanı</th>
                    </tr>
                </thead>
                <tbody id="randevu-tablo-icerik"></tbody>
            </table>
        </div>
    </div>

    <!-- JavaScript İşlemleri -->
    <script>
        const loginBox = document.getElementById('login-box');
        const dashboardBox = document.getElementById('dashboard-box');
        const loginForm = document.getElementById('login-form');
        const tabloIcerik = document.getElementById('randevu-tablo-icerik');
        const adminDuyuruTablo = document.getElementById('admin-duyuru-tablo');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const veri = {
                kullaniciAdi: document.getElementById('kullanici').value,
                sifre: document.getElementById('sifre').value
            };

            fetch('/api/admin-giris', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(veri)
            })
            .then(res => {
                if (!res.ok) throw new Error("Hatalı şifre!");
                return res.json();
            })
            .then(data => {
                if (data.basarili) {
                    loginBox.classList.add('hidden');
                    dashboardBox.classList.remove('hidden');
                    randevulariYukle();
                    duyurulariYukleAdmin();
                }
            })
            .catch(err => {
                alert("Giriş Başarısız: Kullanıcı adı veya şifre hatalı!");
            });
        });

        // Duyuru Gönderme
        document.getElementById('duyuru-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('baslik', document.getElementById('d-baslik').value);
            formData.append('tarih', document.getElementById('d-tarih').value);
            formData.append('icerik', document.getElementById('d-icerik').value);
            
            const gorselDosya = document.getElementById('d-gorsel').files[0];
            if (gorselDosya) {
                formData.append('gorsel', gorselDosya);
            }

            fetch('http://127.0.0.1:8000/api/duyuru-ekle', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                alert(data.mesaj);
                document.getElementById('duyuru-form').reset();
                duyurulariYukleAdmin(); // Tabloyu hemen güncelle
            })
            .catch(err => alert("Duyuru eklenirken hata oluştu!"));
        });

        // Yönetim Panelinde Duyuruları Listeleme
        function duyurulariYukleAdmin() {
            fetch('http://127.0.0.1:8000/api/duyurulari-getir')
            .then(res => res.json())
            .then(data => {
                adminDuyuruTablo.innerHTML = "";
                if (!data.duyurular || data.duyurular.length === 0) {
                    adminDuyuruTablo.innerHTML = `<tr><td colspan="4" class="px-4 py-6 text-center text-gray-500">Kayıtlı duyuru bulunmuyor.</td></tr>`;
                    return;
                }

                data.duyurular.forEach(d => {
                    const satir = `
                        <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                            <td class="px-4 py-3 font-bold text-white">#${d.id}</td>
                            <td class="px-4 py-3 font-semibold text-white">${d.baslik}</td>
                            <td class="px-4 py-3 text-gray-400">${d.tarih}</td>
                            <td class="px-4 py-3 text-right">
                                <button onclick="duyuruSil(${d.id})" class="bg-red-500/20 text-red-400 border border-red-500/30 px-3 py-1 rounded text-xs font-bold hover:bg-red-500 hover:text-white transition-colors">
                                    <i class="fa-solid fa-trash mr-1"></i> Sil
                                </button>
                            </td>
                        </tr>
                    `;
                    adminDuyuruTablo.innerHTML += satir;
                });
            })
            .catch(err => console.error("Admin duyurular yüklenemedi:", err));
        }

        // Duyuru Silme Fonksiyonu
        function duyuruSil(id) {
            if (confirm("Bu duyuruyu silmek istediğinize emin misiniz?")) {
                fetch(`http://127.0.0.1:8000/api/duyuru-sil/${id}`, {
                    method: 'DELETE'
                })
                .then(res => res.json())
                .then(data => {
                    alert(data.mesaj);
                    duyurulariYukleAdmin(); // Tabloyu yenile
                })
                .catch(err => alert("Silme sırasında hata oluştu!"));
            }
        }

        function randevulariYukle() {
            fetch('http://127.0.0.1:8000/api/randevulari-getir')
            .then(res => res.json())
            .then(data => {
                tabloIcerik.innerHTML = "";
                if (data.randevular.length === 0) {
                    tabloIcerik.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-gray-500">Henüz kayıtlı bir randevu talebi bulunmuyor.</td></tr>`;
                    return;
                }

                data.randevular.forEach(r => {
                    const satir = `
                        <tr class="border-b border-white/5 hover:bg-white/5 transition-colors">
                            <td class="px-4 py-3 font-bold text-white">#${r.id}</td>
                            <td class="px-4 py-3 font-semibold text-white">${r.adSoyad}</td>
                            <td class="px-4 py-3">${r.tarih}</td>
                            <td class="px-4 py-3 text-gray-400 max-w-xs truncate">${r.konu}</td>
                            <td class="px-4 py-3 text-xs text-gray-500">${r.kayitZamani}</td>
                        </tr>
                    `;
                    tabloIcerik.innerHTML += satir;
                });
            })
            .catch(err => console.error("Randevular yüklenemedi:", err));
        }

        function cikisYap() {
            dashboardBox.classList.add('hidden');
            loginBox.classList.remove('hidden');
            document.getElementById('kullanici').value = '';
            document.getElementById('sifre').value = '';
        }
    </script>
</body>
</html>
